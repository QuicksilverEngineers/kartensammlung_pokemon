name: Cardmarket-Preise aktualisieren

# Einmalige Momentaufnahme: läuft nur, wenn man sie manuell startet
# (GitHub → Actions → „Cardmarket-Preise aktualisieren“ → Run workflow)
# oder beim Push dieser Workflow-Datei bzw. des Skripts.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/preise.yml
      - scripts/update-prices.mjs
      - scripts/cm-match.json

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-prices.mjs
      - name: Preise committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Cardmarket-Preise aktualisiert"
          # Falls inzwischen ein anderer Lauf etwas committet hat: darauf aufsetzen, eigene Daten gewinnen
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
